<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapping Perutz — Zwischen neun und neun</title>
<meta name="description" content="Eine interaktive OpenStreetMap-Karte der Stationen und Wege des Stanislaus Demba in Leo Perutz' Roman »Zwischen neun und neun« (Wien, 1918).">
<meta property="og:title" content="Mapping Perutz — Zwischen neun und neun">
<meta property="og:description" content="Stanislaus Dembas Tag in Wien, kartiert — gebaut mit der litmap-Engine.">
<meta property="og:url" content="https://hermesj.github.io/mappingPerutz/">
<meta property="og:type" content="website">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="engine/engine.css">
</head>
<body>

<div id="app">

  <header>
    <h1 id="site-title">Mapping Perutz</h1>
    <!-- Work tabs are built from config.json by the engine. -->
    <span class="work-switch" id="work-switch"></span>
    <span class="tagline" id="tagline"></span>
  </header>

  <nav id="sidebar">
    <div class="sidebar-tools">
      <button id="btnShowAll" type="button">Show all</button>
      <button id="btnHideAll" type="button">Hide all</button>
    </div>
    <div id="story-list"></div>
  </nav>

  <div id="map"></div>

</div>

<div class="credit" id="credit"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="engine/engine.js"></script>

</body>
</html>
